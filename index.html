<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jackson Montgomery</title>
<meta name="description" content="Jackson Montgomery: UT Austin Informatics student, builder of TaskaPeer, AI/ML, cybersecurity and software projects.">
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Source+Sans+3:wght@300;400;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#101C30; --ink-2:#16253D; --ink-3:#1D2F4C; --ink-4:#243A5C;
  --line:#2A3D5E; --line-2:#3A5280;
  --text:#F2F6FC; --text-2:#C9D4E8; --muted:#93A3C2;
  --sec:rgba(16,28,48,.88);
  --ai:#FF7A29; --cyber:#2FD8A4; --swe:#6F8FFF; --impl:#E3B341;
  --accent:#FF7A29;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  --mono:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  --fs-mono:.9rem;
  --w:1120px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--accent);color:#0a0a0a}
a{color:inherit}
h1,h2,h3,h4,h5{font-family:var(--display);font-weight:800;margin:0;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{width:100%;max-width:var(--w);margin-inline:auto;padding-inline:clamp(16px,5vw,40px)}
.mono{font-family:var(--mono);font-size:var(--fs-mono);letter-spacing:.14em;text-transform:uppercase}

/* page-wide cursor glow */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(520px circle at var(--gx,-500px) var(--gy,-500px),color-mix(in srgb,var(--accent) 9%,transparent),transparent 65%);
  transition:background .3s}
#root{position:relative;z-index:1}
.scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(14,24,42,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:20px;height:58px}
.mark{font-family:var(--display);font-weight:800;text-decoration:none;font-size:.95rem;letter-spacing:.02em;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.mark i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);transition:background .4s,box-shadow .4s}
.nav-links{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{position:relative;text-decoration:none;color:var(--muted);padding:8px 11px;border-radius:3px;white-space:nowrap;transition:color .2s,background .2s}
.nav-links a:hover{color:var(--text);background:var(--ink-3)}
.nav-links a.on{color:var(--text)}
.nav-links a.on::after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:2px;background:var(--accent);border-radius:2px}

/* hero */
.hero{position:relative;overflow:hidden;background:transparent}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(10,20,40,.7) 0%,rgba(10,20,40,.45) 42%,rgba(10,20,40,0) 72%)}
.hero-in{position:relative;padding-block:clamp(64px,11vw,120px) clamp(170px,26vw,300px)}
.hero h1,.pitch,.eyebrow{text-shadow:0 2px 24px rgba(10,18,34,.55)}
.hero .eyebrow,.hero .lens-label{color:var(--text)}
.hero .pitch{color:#E3EAF6}
.hero-cap{position:absolute;right:clamp(16px,5vw,40px);bottom:18px;color:rgba(242,246,252,.7)}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--muted);margin-bottom:22px;flex-wrap:wrap}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--cyber);box-shadow:0 0 0 0 var(--cyber);animation:ping 2.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(47,216,164,.5)}80%,100%{box-shadow:0 0 0 10px rgba(47,216,164,0)}}
.hero h1{font-size:clamp(3rem,10vw,6.4rem);letter-spacing:-.05em;line-height:.9}
.hero h1 .l2{display:block;color:#F6C29C}
.hero h1 .ch{display:inline-block;transition:transform .35s cubic-bezier(.2,.8,.2,1),color .25s}
.hero h1 .ch:hover{transform:translateY(-.12em);color:var(--accent);-webkit-text-stroke:0}

.lens{margin-top:38px;max-width:760px}
.lens-label{color:var(--muted);margin-bottom:12px}
.lens-row{position:relative;display:flex;flex-wrap:wrap;gap:6px;padding:5px;background:rgba(22,37,61,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:6px;width:fit-content;max-width:100%}
.lens-btn{position:relative;z-index:1;padding:10px 14px;border-radius:4px;color:var(--muted);font-family:var(--mono);font-size:var(--fs-mono);letter-spacing:.12em;text-transform:uppercase;transition:color .25s;display:flex;align-items:center;gap:8px}
.lens-btn i{width:7px;height:7px;border-radius:50%;background:var(--c);opacity:.55;transition:opacity .25s}
.lens-btn:hover{color:var(--text)}
.lens-btn:hover i,.lens-btn.on i{opacity:1}
.lens-btn.on{color:#0B0B0B;background:var(--c);font-weight:500}
.lens-btn.on i{background:#0B0B0B}
.pitch{margin-top:20px;font-size:clamp(1.1rem,2.2vw,1.35rem);line-height:1.55;color:var(--text-2);font-weight:300;max-width:58ch;min-height:4.7em}
.pitch b{color:var(--text);font-weight:600}
.pitch span{display:inline-block;animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--mono);font-size:var(--fs-mono);letter-spacing:.12em;text-transform:uppercase;padding:12px 17px;border:1px solid var(--line-2);border-radius:4px;color:var(--text-2);background:var(--ink-2);transition:border-color .2s,color .2s,transform .2s,background .2s}
.btn:hover{color:var(--text);border-color:var(--accent);transform:translateY(-2px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#0B0B0B;font-weight:500}
.btn.pri:hover{filter:brightness(1.1)}
.btn svg{width:14px;height:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);background:var(--sec);position:relative}
.stat{padding:22px clamp(16px,4vw,34px);border-left:1px solid var(--line);transition:background .25s}
.stat:first-child{border-left:0}
.stat:hover{background:var(--ink-2)}
.stat b{display:block;font-family:var(--display);font-size:clamp(1.5rem,3.4vw,2.1rem);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted)}

/* sections */
section{padding-block:clamp(64px,9vw,104px);border-bottom:1px solid var(--line);scroll-margin-top:58px;background:var(--sec);position:relative}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:36px}
.sec-head h2{font-size:clamp(1.9rem,4.6vw,3rem)}
.sec-head .k{color:var(--accent);margin-bottom:10px;display:block;transition:color .4s}
.sec-head p{color:var(--muted);max-width:44ch;font-size:.975rem}
.prose{max-width:66ch;color:var(--text-2);font-weight:300;display:grid;gap:18px;font-size:1.125rem}
.prose b{color:var(--text);font-weight:600}

/* lens matching */
.m{transition:opacity .35s,filter .35s}
.dim{opacity:.28;filter:saturate(.3)}
.match-tag{display:inline-flex;align-items:center;gap:6px;color:var(--accent);opacity:0;transform:translateX(-4px);transition:opacity .3s,transform .3s}
.match-tag.on{opacity:1;transform:none}

/* tilt card */
.card{position:relative;border:1px solid var(--line);background:var(--ink-2);border-radius:8px;padding:24px clamp(18px,3vw,28px);overflow:hidden;
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,border-color .25s,background .25s,opacity .35s,filter .35s;will-change:transform}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 13%,transparent),transparent 60%)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;opacity:0;transition:opacity .3s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),var(--accent),transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card:hover{background:var(--ink-3)}
.card:hover::before,.card:hover::after{opacity:1}

/* experience */
.tl{display:grid;gap:14px}
.tl-item{display:grid;grid-template-columns:170px 1fr;gap:clamp(16px,4vw,40px)}
.tl-when{color:var(--muted);line-height:1.8;padding-top:4px}
.tl-when em{display:block;font-style:normal;color:var(--muted)}
.role{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.02em}
.role .org{color:var(--accent);transition:color .4s}
.sub{color:var(--muted);font-size:.95rem;margin-top:4px}
.bul{margin-top:14px;display:grid;gap:8px}
.bul li{position:relative;padding-left:20px;color:var(--text-2);font-weight:300}
.bul li::before{content:"";position:absolute;left:0;top:.75em;width:9px;height:1px;background:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{font-family:var(--mono);font-size:.625rem;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:3px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent)}

/* projects */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line-2);margin-bottom:28px;position:relative;overflow-x:auto;scrollbar-width:none}
.tab{padding:14px 20px 16px;font-family:var(--display);font-weight:700;font-size:clamp(1.05rem,2.4vw,1.35rem);color:var(--muted);transition:color .2s;white-space:nowrap;display:flex;gap:10px;align-items:baseline}
.tab small{font-family:var(--mono);font-size:var(--fs-mono);letter-spacing:.1em;color:var(--muted);font-weight:400}
.tab:hover{color:var(--text-2)}
.tab.on{color:var(--text)}
.tab-bar{position:absolute;bottom:-1px;height:2px;background:var(--accent);transition:left .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1),background .4s}
.cat-note{color:var(--muted);font-size:.975rem;max-width:62ch;margin-bottom:24px}
.orgs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.org-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:6px;background:var(--ink-2);text-align:left;transition:border-color .2s,background .2s,transform .2s}
.org-btn:hover{border-color:var(--line-2);transform:translateY(-2px)}
.org-btn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--ink-2))}
.org-btn b{font-family:var(--display);font-weight:700;font-size:1rem}
.org-btn span{color:var(--muted)}
.org-intro{color:var(--text-2);font-weight:300;margin-bottom:18px;max-width:70ch}
.pgrid{display:grid;gap:14px}
.pcard{cursor:pointer}
.pcard-top{display:flex;justify-content:space-between;align-items:start;gap:16px}
.kicker{color:var(--accent);margin-bottom:10px;transition:color .4s}
.pcard h4{font-size:1.25rem;letter-spacing:-.015em}
.pcard .summary{color:var(--text-2);font-weight:300;margin-top:10px;max-width:72ch}
.plus{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;transition:transform .35s,border-color .2s,background .2s}
.plus svg{width:14px;height:14px}
.pcard:hover .plus{border-color:var(--accent)}
.pcard.open .plus{transform:rotate(45deg);background:var(--accent);border-color:var(--accent);color:#0B0B0B}
.expand{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.pcard.open .expand{grid-template-rows:1fr}
.expand > div{overflow:hidden}
.fields{margin-top:18px;border-top:1px solid var(--line)}
.field{display:grid;grid-template-columns:140px 1fr;gap:clamp(12px,3vw,24px);padding-block:14px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field dt{color:var(--muted);padding-top:3px}
.field dd{margin:0;color:var(--text-2);font-weight:300}
.soon{display:inline-flex;align-items:center;gap:8px;color:var(--muted);border:1px dashed var(--line-2);border-radius:3px;padding:6px 10px}
.soon::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:var(--fs-mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-2);border-radius:3px;padding:5px 10px;color:var(--text-2);background:var(--ink-3);transition:color .2s,border-color .2s,transform .2s,background .2s,opacity .35s}
.chip:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
.chip.hit{color:#0B0B0B;background:var(--accent);border-color:var(--accent)}
.chip.dim{opacity:.3}
.pg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pg-grid .num{font-family:var(--display);font-size:2.4rem;font-weight:800;color:var(--line-2);line-height:1;letter-spacing:-.04em;transition:color .3s}
.pg-grid .card:hover .num{color:var(--accent)}

/* projects: post-grad mini cards */
.pg-mini{cursor:pointer}
.pg-mini h4{font-size:1.1rem;margin-top:2px}
.pg-mini .num{display:block;margin-bottom:8px}
.pg-mini .plus svg{width:13px;height:13px}
.pg-mini:hover .plus{background:var(--accent);color:#0B0B0B;transform:translate(2px,-2px)}

/* postgraduate program */
.pgp-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--ink-2)}
.pgp-facts div{padding:18px 20px;border-left:1px solid var(--line);display:grid;gap:4px}
.pgp-facts div:first-child{border-left:0}
.pgp-facts b{font-family:var(--display);font-size:clamp(1.4rem,3vw,1.9rem);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pgp-facts span{color:var(--muted)}
.pgp{display:grid;grid-template-columns:290px 1fr;gap:22px;align-items:start;margin-top:8px}
.rail{position:sticky;top:76px;display:grid;gap:4px;padding-left:14px;border-left:1px solid var(--line-2)}
.rail-item{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:6px;color:var(--muted);transition:background .2s,color .2s,opacity .35s,filter .35s}
.rail-item::before{content:"";position:absolute;left:-19px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:1px solid var(--line-2);transition:background .25s,border-color .25s,box-shadow .25s}
.rail-item:hover{background:var(--ink-2);color:var(--text-2)}
.rail-item.on{background:var(--ink-3);color:var(--text)}
.rail-item.on::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--accent)}
.rail-n{padding-top:3px;color:inherit}
.rail-t{display:grid;gap:2px}
.rail-t b{font-family:var(--display);font-weight:700;font-size:.98rem;line-height:1.25}
.rail-t span{color:var(--muted);font-size:.625rem}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--ink-2);padding:clamp(20px,3.4vw,34px);animation:panelIn .45s cubic-bezier(.2,.8,.2,1) both;min-width:0}
@keyframes panelIn{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.panel-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.pager{display:flex;gap:6px;flex:0 0 auto}
.pg-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;transition:border-color .2s,background .2s,color .2s,transform .2s}
.pg-btn:hover{border-color:var(--accent);background:var(--accent);color:#0B0B0B;transform:scale(1.06)}
.proj-label{color:var(--muted);margin-top:28px}
.proj-title{font-size:clamp(1.45rem,3.4vw,2.1rem);margin-top:8px;letter-spacing:-.03em}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.metric{padding:16px;border:1px solid var(--line);border-radius:6px;background:var(--ink);display:grid;gap:6px;animation:fadeUp .5s ease both;transition:border-color .25s,transform .25s}
.metric:hover{border-color:var(--accent);transform:translateY(-3px)}
.metric b{font-family:var(--display);font-size:clamp(1.25rem,2.6vw,1.7rem);letter-spacing:-.03em;color:var(--accent);line-height:1.1;transition:color .4s;font-variant-numeric:tabular-nums}
.metric span{color:var(--muted);font-size:.85rem;line-height:1.35}
.quote{margin:0;padding-left:14px;border-left:2px solid var(--accent);color:var(--text);font-style:italic}

/* cyber */
.cy-top{display:grid;grid-template-columns:minmax(0,68ch);gap:clamp(24px,5vw,56px);align-items:start}
.phase{display:flex;flex-wrap:wrap;max-width:100%;gap:6px;padding:5px;background:var(--ink-2);border:1px solid var(--line);border-radius:6px;width:fit-content;margin-bottom:20px}
.phase button{padding:10px 16px;text-align:left;border-radius:4px;color:var(--muted);transition:color .2s,background .2s}
.phase button.on{background:var(--cyber);color:#04120D}
.phase-body h3{font-size:1.5rem;margin-bottom:10px}
.phase-body p{color:var(--text-2);font-weight:300}
.phase-body .bul{margin-top:16px}
.phase-body .bul li::before{background:var(--cyber)}
.terminal{border:1px solid var(--line);border-radius:8px;background:#05070A;overflow:hidden;font-family:var(--mono);font-size:.75rem;line-height:1.8}
.term-bar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--ink-2);align-items:center}
.term-bar i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.term-bar span{margin-left:10px;color:var(--muted);font-size:.65rem;letter-spacing:.1em}
.term-body{padding:16px 18px;min-height:230px;color:var(--text-2);overflow-x:auto}
.term-body .ok{color:var(--cyber)}
.term-body .pr{color:var(--muted)}
.caret{display:inline-block;width:7px;height:1em;background:var(--cyber);vertical-align:-2px;animation:blink 1s steps(1) infinite}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:40px}
.mod{padding:18px;border:1px solid var(--line);border-radius:6px;background:var(--ink-2);transition:border-color .25s,transform .25s,background .25s}
.mod:hover{border-color:var(--cyber);transform:translateY(-3px);background:color-mix(in srgb,var(--cyber) 6%,var(--ink-2))}
.mod .mn{color:var(--cyber);margin-bottom:8px}
.mod b{display:block;font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.25}
.mod p{color:var(--muted);font-size:.875rem;margin-top:6px;line-height:1.45}

/* edu */
.edu{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.edu h4{font-size:1.25rem}
.meta{color:var(--muted);margin-top:8px}

/* skills */
.skills{display:grid;gap:26px}
.skill-row{display:grid;grid-template-columns:170px 1fr;gap:clamp(16px,4vw,40px);align-items:start}
.skill-row > span{color:var(--muted);padding-top:6px}

/* interests */
.int-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:260px;gap:12px;grid-auto-flow:dense}
.int{padding:0;display:flex;align-items:flex-end;min-height:0;isolation:isolate}
.int-big{grid-column:span 2;grid-row:span 2}
.int-wide{grid-column:span 2}
.int-img,.int-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .4s;z-index:-1}

function Tilt({ className = "", children, onClick, ...rest }) {
  const ref = useRef(null);
  const move = e => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    el.style.setProperty("--mx", x * 100 + "%");
    el.style.setProperty("--my", y * 100 + "%");
    if (!REDUCE && r.height < 420) {
      el.style.setProperty("--ry", (x - .5) * 5 + "deg");
      el.style.setProperty("--rx", (.5 - y) * 5 + "deg");
    }
  };
  const leave = () => { const el = ref.current; if (!el) return; el.style.setProperty("--rx","0deg"); el.style.setProperty("--ry","0deg"); };
  return html`<div ref=${ref} className=${"card " + className} onPointerMove=${move} onPointerLeave=${leave} onClick=${onClick} ...${rest}>${children}</div>`;
}

/* ---- page background: blurred photo + falling snow that moves away from the cursor ---- */
function Mountains() {
  const cv = useRef(null);
  useEffect(() => {
    const c = cv.current, ctx = c.getContext("2d");
    let W = 0, H = 0, raf, mx = 0, tx = 0, px = -9999, py = -9999;
    const rnd = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
    const flakes = Array.from({ length: 150 }, (_, i) => { const r = rnd(900 + i); return { x: r(), y: r(), z: .3 + r() * .7, s: r() * 6.28 }; });
    const size = () => { W = innerWidth; H = innerHeight; const d = Math.min(devicePixelRatio || 1, 2); c.width = W * d; c.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
    const pm = e => { tx = e.clientX / W - .5; px = e.clientX; py = e.clientY; };
    addEventListener("pointermove", pm);
    const frame = () => {
      mx += (tx - mx) * .05; ctx.clearRect(0, 0, W, H);
      for (const f of flakes) {
        f.y += .0008 * (f.z + .25); f.s += .01; f.x += Math.sin(f.s) * .0004 + mx * .0006;
        if (f.y > 1.02) f.y = -.02; if (f.x > 1.02) f.x = -.02; if (f.x < -.02) f.x = 1.02;
        let x = f.x * W, y = f.y * H; const dx = x - px, dy = y - py, d2 = dx * dx + dy * dy;
        if (d2 < 14400) { const d = Math.sqrt(d2) || 1, k = (120 - d) / 120; f.x += dx / d * k * .004; f.y += dy / d * k * .003; x = f.x * W; y = f.y * H; }
        ctx.fillStyle = `rgba(255,255,255,${.3 + f.z * .5})`; ctx.beginPath(); ctx.arc(x, y, .6 + f.z * 1.7, 0, 6.283); ctx.fill();
      }
      raf = requestAnimationFrame(frame);
    };
    size(); addEventListener("resize", size);
    if (!REDUCE) frame();
    return () => { cancelAnimationFrame(raf); removeEventListener("resize", size); removeEventListener("pointermove", pm); };
  }, []);
  return html`<${React.Fragment}><div className="page-bg" aria-hidden="true"></div><canvas ref=${cv} className="scene" aria-hidden="true"></canvas><//>`;
}

function Count({ to, suffix = "", dec = 0 }) {
  const [v, setV] = useState(to);
  const ref = useRef(null);
  useEffect(() => {
    if (REDUCE || !("IntersectionObserver" in window)) return;
    let done = false;
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting || done) return; done = true;
      const t0 = performance.now();
      const step = n => { const k = Math.min(1, (n - t0) / 1100), ease = 1 - Math.pow(1 - k, 3); setV(to * ease); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
    io.observe(ref.current); return () => io.disconnect();
  }, []);
  return html`<b ref=${ref}>${v.toFixed(dec)}${suffix}</b>`;
}

/* ---- in-page slide deck viewer ---- */
const DeckBus = { open: null };
function DeckButton({ deck }) {
  return html`<button className="btn" onClick=${e => { e.stopPropagation(); DeckBus.open && DeckBus.open(deck); }}>Open slide deck <${Arrow}/></button>`;
}
function stripDeck(title, name, n) { return { title, strip: { base: `decks/pgp/${name}`, n, per: 8 } }; }
const deckCount = d => d.slides ? d.slides.length : d.strip.n;
function Slide({ deck, i, className }) {
  if (deck.slides) return html`<img className=${className} src=${deck.slides[i]} alt=${"Slide " + (i + 1)} loading="lazy" />`;
  const { base, per } = deck.strip, k = Math.floor(i / per), j = i % per;
  return html`<div className=${className + " slide-strip"} role="img" aria-label=${"Slide " + (i + 1)}
    style=${{ backgroundImage: `url(${base}-${k + 1}.jpg)`, backgroundSize: `100% ${per * 100}%`, backgroundPosition: `0 ${(j / (per - 1)) * 100}%` }}></div>`;
}
function DeckViewer() {
  const [deck, setDeck] = useState(null);
  const [i, setI] = useState(0);
  useEffect(() => { DeckBus.open = d => { setDeck(d); setI(0); }; return () => { DeckBus.open = null; }; }, []);
  useEffect(() => {
    if (!deck) return;
    const n = deckCount(deck);
    const key = e => { if (e.key === "Escape") setDeck(null); if (e.key === "ArrowRight") setI(x => Math.min(n - 1, x + 1)); if (e.key === "ArrowLeft") setI(x => Math.max(0, x - 1)); };
    addEventListener("keydown", key); document.body.style.overflow = "hidden";
    return () => { removeEventListener("keydown", key); document.body.style.overflow = ""; };
  }, [deck]);
  useEffect(() => { const el = document.querySelector(".deck-thumbs .on"); if (el) el.scrollIntoView({ block: "nearest", inline: "center", behavior: REDUCE ? "auto" : "smooth" }); }, [i, deck]);
  if (!deck) return null;
  const n = deckCount(deck);
  return html`<div className="deck-modal" role="dialog" aria-modal="true" aria-label=${deck.title} onClick=${() => setDeck(null)}>
    <div className="deck-box" onClick=${e => e.stopPropagation()}>
      <div className="deck-top"><span>${deck.title}</span><button className="deck-x" onClick=${() => setDeck(null)} aria-label="Close">Close ✕</button></div>
      <div className="deck-stage">
        <${Slide} deck=${deck} i=${i} className="deck-slide" />
      </div>
      <div className="deck-nav">
        <button className="pg-btn" onClick=${() => setI(Math.max(0, i - 1))} disabled=${i === 0} aria-label="Previous slide">←</button>
        <span>${i + 1} / ${n}</span>
        <button className="pg-btn" onClick=${() => setI(Math.min(n - 1, i + 1))} disabled=${i === n - 1} aria-label="Next slide">→</button>
      </div>
      <div className="deck-thumbs">${Array.from({ length: n }, (_, k) => html`<button key=${k} className=${k === i ? "on" : ""} onClick=${() => setI(k)} aria-label=${"Go to slide " + (k + 1)}><${Slide} deck=${deck} i=${k} className="deck-thumb" /></button>`)}</div>
    </div>
  </div>`;
}
